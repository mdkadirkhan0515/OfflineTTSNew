name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OfflineTTS Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Project Files
        run: |
          test -f package.json
          test -f package-lock.json
          test -f android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Project files verified."

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify React Native and MMKV Versions
        run: |
          npm ls react-native react react-native-mmkv react-native-nitro-modules

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/build.gradle.kts', 'android/app/build.gradle', 'android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean Previous Build
        run: |
          cd android
          ./gradlew clean --no-daemon

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

      - name: Find and Prepare APK
        run: |
          set -eu

          mkdir -p build-artifacts

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found. Searching release output..."
            APK_PATH="$(find android/app/build/outputs/apk/release \
              -type f -name '*.apk' -print -quit)"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" build-artifacts/OfflineTTS-release.apk

          echo "APK successfully prepared:"
          ls -lh build-artifacts/OfflineTTS-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTTS-Android-APK
          path: build-artifacts/OfflineTTS-release.apk
          retention-days: 30
          if-no-files-found: error
